---
- name: Install hyprland and utilities
  community.general.pacman:
    name:
      - ghostty
      - nautilus
      - egl-wayland
      - hypridle
      - hyprland
      - hyprlock
      - hyprpolkitagent
      - hyprsunset
      - impala
      - mako
      - nwg-look
      - power-profiles-daemon
      - wayland-utils
      - wl-clipboard
      - xdg-desktop-portal
      - xdg-desktop-portal-hyprland
      - xdg-user-dirs
      - xorg-server-xwayland
      # Screenshots
      - grim
      - slurp
    state: present

- name: Create config directory
  file:
    path: "{{ home_dir }}/.config/hypr"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Hyprland config
  ansible.builtin.template:
    src: "{{ item }}.conf.j2"
    dest: "{{ home_dir }}/.config/hypr/{{ item }}.conf"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'
  with_items:
    - hyprland
    - hypridle
    - hyprlock
    - hyprpaper
    - monitors
    - my-programs
    - autostart
    - env-vars
    - permissions
    - look-and-feel
    - input
    - keybindings
    - window-rules
    - workspace-rules

- name: Ensure users dirs
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command: xdg-user-dirs-update
  args:
    creates: "{{ home_dir }}/Downloads"
